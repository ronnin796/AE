[project]
name = "aetheredge-ml"
version = "0.1.0"
description = "AetherEdge ML Tooling for model export and quantization"
authors = [{name = "AetherEdge Team"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
    "onnxruntime-tools>=1.16.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "C90"]
ignore = []

[tool.black]
line-length = 100
target-version = ["py311"]